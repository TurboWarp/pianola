<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>worker</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    html, body { height: 100%; font-size: 12px; line-height: 1.4; }
    body { display: flex; flex-direction: column; }
    #status { padding: 4px 8px; white-space: pre; overflow: hidden; contain: strict; height: 51px; box-sizing: border-box; }
    #job { flex: 1; position: relative; min-height: 0; }
    #job iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
  <script type="module" src="worker.js"></script>
</head>
<body>
  <p id="readback-warning" class="warning" hidden></p>
  <p id="wake-lock-warning" class="warning" hidden></p>
  <div id="status">starting</div>
  <div id="job"></div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>runner</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="stage.css">
  <style>
    html, body { height: 100%; font-size: 13px; line-height: 1.4; }
    body { display: flex; flex-direction: column; }
    #stage { flex: 1; min-height: 0; }
    /* Fixed size, so updating it never changes the layout of anything else. */
    #status { padding: 6px 10px; white-space: pre-wrap; overflow: auto; height: 6.5em; box-sizing: border-box; contain: strict; }
  </style>
  <!-- Must run before a build is loaded so the libraries only see the patched Date and Math.random. -->
  <script src="determinism.js"></script>
  <script type="module" src="replay.js"></script>
</head>
<body>
  <div id="stage"></div>
  <div id="status">loading</div>
</body>
</html>

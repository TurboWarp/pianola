<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>queue</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    html, body { font-size: 12px; line-height: 1.4; }
    body { padding: 8px; }
    h2 { font-size: 12px; margin: 12px 0 4px; color: var(--muted); font-weight: normal; text-transform: uppercase; }
    table { border-collapse: collapse; }
    th, td { text-align: left; padding: 1px 12px 1px 0; white-space: nowrap; }
    th { color: var(--muted); font-weight: normal; }
    .stale { color: var(--bad); }
    .altered { color: #fff; background: #c62828; padding: 0 4px; font-weight: bold; }
    button { font: inherit; background: var(--control); color: var(--text); border: 1px solid var(--border); padding: 0 6px; cursor: pointer; }
  </style>
  <script type="module" src="queue.js"></script>
</head>
<body>
  <div id="summary">loading</div>
  <h2>Workers</h2>
  <table>
    <thead><tr><th>worker</th><th>job</th><th>done</th><th>failed</th><th>last seen</th><th>browser</th><th></th></tr></thead>
    <tbody id="workers"></tbody>
  </table>
  <h2>Batches</h2>
  <table>
    <thead><tr><th>id</th><th>label</th><th>progress</th><th>pending</th><th>running</th><th>done</th><th>failed</th><th>eta</th><th>created</th><th></th></tr></thead>
    <tbody id="batches"></tbody>
  </table>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>painter</title>
  <link rel="stylesheet" href="/runner/stage.css">
  <link rel="stylesheet" href="painter.css">
  <!-- Must run before a build is loaded so the libraries only see the patched Date and Math.random. -->
  <script src="/runner/determinism.js"></script>
  <script type="module" src="painter.js"></script>
</head>
<body>
  <main id="picker" hidden>
    <h1>painter</h1>
    <p id="picker-banned" class="banned" hidden></p>
    <p>
      <label>Build <select id="picker-build"></select></label>
      <span class="hint" id="picker-build-hint"></span>
    </p>
    <table>
      <thead><tr><th>Project</th><th>Title</th><th>Recording</th><th></th></tr></thead>
      <tbody id="picker-projects"></tbody>
    </table>
  </main>

  <div id="session" hidden>
    <section id="stage-area">
      <div id="project-controls">
        <button id="green-flag" title="Green flag (recorded)">&#9873; Green flag</button>
        <button id="stop-sign" title="Stop sign (recorded)">&#11203; Stop</button>
        <label><input id="turbo" type="checkbox"> Turbo</label>
        <label title="Keep running scripts until a redraw or 75% of the frame, like TurboWarp. Off: one pass per frame, so busy-waiting scripts do not burn CPU."><input id="fill-frames" type="checkbox" checked> Fill frames</label>
        <label title="Frames per real second; does not change what the project does">Speed <input id="speed" type="range" min="1" max="10" step="1"> <span id="speed-value"></span></label>
      </div>
      <div id="stage"></div>
    </section>
    <aside id="sidebar">
      <h2 id="title"></h2>
      <div id="byline" class="hint"></div>
      <div id="status" class="status"></div>

      <div class="buttons">
        <button id="start" class="primary">Start recording</button>
        <button id="pause">Pause</button>
        <button id="finish">Finish</button>
        <button id="save" class="primary">Save</button>
        <button id="restart">Restart</button>
        <a id="back" href="./">Back to projects</a>
      </div>

      <dl id="stats">
        <dt>CPU time (scripts and drawing)</dt>
        <dd>
          <span id="stat-cpu">0.00 s</span>
          <span class="target">of <input id="target" type="number" min="1" step="1"> s</span>
          <div class="cpu-bar"><span id="bar-execute"></span><span id="bar-draw"></span></div>
          <div class="cpu-legend">
            <span><i class="swatch execute"></i>scripts <span id="stat-execute">0.00 s</span></span>
            <span><i class="swatch draw"></i>drawing <span id="stat-draw">0.00 s</span></span>
          </div>
          <label class="target"><input id="auto-stop" type="checkbox"> Finish when reached</label>
        </dd>
        <dt>Frame</dt><dd id="stat-frame">0</dd>
        <dt>Speed</dt><dd id="stat-speed">-</dd>
        <dt>Inputs</dt><dd id="stat-inputs">0</dd>
        <dt>Framerate</dt><dd id="stat-framerate"></dd>
        <dt>Build</dt><dd id="stat-build"></dd>
      </dl>

      <div id="errors" hidden>
        <h3>Errors</h3>
        <ul id="error-list"></ul>
      </div>
    </aside>
  </div>
</body>
</html>
